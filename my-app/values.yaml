global:
  nfsServer: 192.168.10.178
  storageClass: nfs-client

backend:
  image: excelazmin/mern-blog-server:latest
  replicaCount: 2
  dbUrl: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb:27017/mydb?authSource=admin"
  servicePort: 5001
  imageStorageSize: 10Gi

frontend:
  image: excelazmin/mern-blog-client:latest
  replicaCount: 2
  servicePort: 80
  containerPort: 3000

mongodb:
  image: mongo:5.0
  replicaCount: 1
  servicePort: 27017
  storageSize: 20Gi
  rootUsername: root
  rootPassword: example
