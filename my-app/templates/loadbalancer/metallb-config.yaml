apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: private-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.10.68-192.168.10.69

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: private-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
  - private-ip-pool