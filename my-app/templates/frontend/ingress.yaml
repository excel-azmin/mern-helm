# Step 1: Keep REACT_APP_BASE_URL as http://blog.myapps.com/api


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.frontendHost }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: {{ .Values.backend.servicePort }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: {{ .Values.frontend.servicePort }}

# Set REACT_APP_BASE_URL to http://blog.myapps.com (remove /api): REACT_APP_BASE_URL=http://blog.myapps.com


